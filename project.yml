name: Annotate
options:
  bundleIdPrefix: com.sunimp
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"

targets:
  Annotate:
    type: application
    platform: macOS
    sources:
      - path: Annotate
        excludes:
          - "Sounds/**"
      - path: Annotate/Sounds
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    scheme:
      testTargets:
        - AnnotateTests
      # Tests assert English text. Xcode runs them inside Annotate.app, whose bundle carries
      # every .lproj, so on a Mac set to another language they would read translated strings.
      language: en
      region: US
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunimp.Annotate
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Annotate/Annotate.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_EMIT_LOC_STRINGS: true
        LOCALIZATION_PREFERS_STRING_CATALOGS: true
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Annotate/Info.plist
        ENABLE_PREVIEWS: true
        DEVELOPMENT_ASSET_PATHS: '"Annotate/Preview Content"'
      # The link scheme in Info.plist. Debug builds get their own so they never take links
      # meant for the installed app. Keep in sync with AnnotateCommand.urlScheme.
      configs:
        Debug:
          ANNOTATE_URL_SCHEME: annotate-debug
        Release:
          ANNOTATE_URL_SCHEME: annotate

  AnnotateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AnnotateTests
    dependencies:
      - target: Annotate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"
