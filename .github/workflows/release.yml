name: Release (macOS)

# Builds an ad-hoc signed, non-notarized app, publishes ZIP + DMG + SHA256SUMS to a GitHub Release,
# and (when SPARKLE_PRIVATE_KEY is set) signs the ZIP for Sparkle and updates appcast.xml on main.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.9.0 (no v prefix)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APP_NAME: Annotate
      SCHEME: Annotate
      DERIVED_DATA: build/dd

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Tags are the bare version (1.9.0), without a v prefix.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$VERSION_INPUT"
          fi
          semver="$tag"
          if ! [[ "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$semver'; use X.Y.Z without a v prefix"
            exit 1
          fi
          # Commit count + offset keeps build numbers monotonic (v1.0.12 was build 1012).
          build_number=$(($(git rev-list --count HEAD) + 1000))
          prerelease=false
          [[ "$semver" == *-test* || "$semver" == *-alpha* || "$semver" == *-beta* ]] && prerelease=true
          {
            echo "tag=$tag"
            echo "semver=$semver"
            echo "build_number=$build_number"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: brew install xcodegen pandoc xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ad-hoc signed release app
        id: build
        run: |
          set -euo pipefail
          # No Developer ID certificate in CI, so sign ad-hoc ("-").
          # Hardened runtime stays off: library validation rejects Sparkle.framework when the app
          # has no Team ID, and it adds nothing to a non-notarized build. Turn it back on together
          # with Developer ID signing and notarization.
          xcodebuild clean build \
            -project Annotate.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="${{ steps.version.outputs.semver }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            2>&1 | xcbeautify

          app_path="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          [ -d "$app_path" ] || { echo "::error::Cannot find $app_path"; exit 1; }
          codesign --verify --deep --verbose=2 "$app_path"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Package ZIP, DMG and checksums
        id: package
        run: |
          set -euo pipefail
          semver="${{ steps.version.outputs.semver }}"
          release_dir="build/release"
          rm -rf "$release_dir" build/export
          mkdir -p "$release_dir" build/export

          # ditto keeps the code signature and extended attributes.
          zip_name="$APP_NAME-$semver.zip"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.build.outputs.app_path }}" "$release_dir/$zip_name"
          # Fixed name for install.sh, which downloads releases/latest/download/Annotate.zip.
          cp "$release_dir/$zip_name" "$release_dir/$APP_NAME.zip"

          cp -R "${{ steps.build.outputs.app_path }}" build/export/
          dmg_path=$(MARKETING_VERSION="$semver" ./scripts/packaging/make_dmg.sh)
          mv "$dmg_path" "$release_dir/"
          dmg_name=$(basename "$dmg_path")

          (cd "$release_dir" && shasum -a 256 "$zip_name" "$APP_NAME.zip" "$dmg_name" > SHA256SUMS.txt)
          cat "$release_dir/SHA256SUMS.txt"

          {
            echo "release_dir=$release_dir"
            echo "zip_name=$zip_name"
            echo "zip_path=$release_dir/$zip_name"
            echo "dmg_name=$dmg_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.semver }}
          path: ${{ steps.package.outputs.release_dir }}

      - name: Create release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          release_dir="${{ steps.package.outputs.release_dir }}"

          prev_tag=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vxF "$tag" | head -n 1 || true)
          if [ -n "$prev_tag" ]; then
            bullets=$(git log --no-merges --pretty=format:'- %s' "$prev_tag..HEAD" || true)
          else
            bullets=$(git log --no-merges --pretty=format:'- %s' -n 30 || true)
          fi
          [ -n "$bullets" ] || bullets="- 常规维护与稳定性优化"

          notes_path="$release_dir/RELEASE_NOTES.md"
          # generate_appcast_entry.sh drops everything from "### 安装提示" on, so keep it after
          # 更新内容 and keep the heading text in sync with that script.
          {
            echo "## Annotate $tag"
            echo
            echo "此 Release 由 GitHub Actions 自动构建。"
            echo
            echo "### 更新内容"
            echo
            echo "$bullets"
            echo
            echo "### 安装提示"
            echo
            echo "**一键安装或更新（推荐）**：在终端执行以下命令，脚本会把 \`$APP_NAME.app\` 安装到 \`/Applications\`（非管理员账户为 \`~/Applications\`）并打开。"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh"
            echo '```'
            echo
            echo "**手动安装**：下载下方的 \`${{ steps.package.outputs.dmg_name }}\`，打开后将 \`$APP_NAME.app\` 拖入 \`/Applications\`；或下载 \`${{ steps.package.outputs.zip_name }}\` 解压后拖入。"
            echo
            echo "当前自动构建产物未进行 Developer ID 签名和公证。手动下载后首次打开时，如 macOS 提示“无法验证开发者”或阻止启动，请在确认来源可信后执行以下命令移除隔离属性："
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/$APP_NAME.app"
            echo "open /Applications/$APP_NAME.app"
            echo '```'
            echo
            echo "若 App 放在其他目录，请把上面命令中的路径替换为实际位置。"
            echo
            echo "### SHA-256"
            echo
            echo '```text'
            cat "$release_dir/SHA256SUMS.txt"
            echo '```'
          } > "$notes_path"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          dir="${{ steps.package.outputs.release_dir }}"
          files=(
            "$dir/${{ steps.package.outputs.dmg_name }}"
            "$dir/${{ steps.package.outputs.zip_name }}"
            "$dir/$APP_NAME.zip"
            "$dir/SHA256SUMS.txt"
          )
          flags=(--title "Annotate $tag" --notes-file "${{ steps.notes.outputs.notes_path }}")
          [ "${{ steps.version.outputs.prerelease }}" = true ] && flags+=(--prerelease)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" "${flags[@]}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$tag" "${files[@]}" "${flags[@]}" --verify-tag
          else
            gh release create "$tag" "${files[@]}" "${flags[@]}" --target "$GITHUB_SHA"
          fi

      - name: Sign Sparkle update
        id: sparkle
        if: ${{ steps.version.outputs.prerelease == 'false' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set; skipping Sparkle signing and the appcast update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip_path="${{ steps.package.outputs.zip_path }}"
          signature=$(./scripts/ci/sign_sparkle_update.sh "$zip_path" "$SPARKLE_PRIVATE_KEY")
          {
            echo "enabled=true"
            echo "signature=$signature"
            echo "length=$(stat -f%z "$zip_path")"
          } >> "$GITHUB_OUTPUT"

      - name: Update appcast and version on main
        if: ${{ steps.sparkle.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          semver="${{ steps.version.outputs.semver }}"

          # The checkout is a detached tag. Switch to main first so the push is a fast-forward
          # even when main moved on after the tag.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          ./scripts/ci/generate_appcast_entry.sh \
            "$tag" \
            "$semver" \
            "${{ steps.version.outputs.build_number }}" \
            "${{ steps.sparkle.outputs.signature }}" \
            "${{ steps.sparkle.outputs.length }}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/${{ steps.package.outputs.zip_name }}"

          # Annotate.xcodeproj is generated by xcodegen and gitignored, so only project.yml needs syncing.
          if [[ "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i '' -E "s/(MARKETING_VERSION:[[:space:]]*\")[^\"]*(\")/\1${semver}\2/" project.yml
            grep -q "MARKETING_VERSION: \"${semver}\"" project.yml || {
              echo "::error::MARKETING_VERSION sync failed; project.yml format may have changed"
              exit 1
            }
          fi

          git add appcast.xml project.yml
          if git diff --cached --quiet; then
            echo "No changes to appcast.xml or project.yml"
            exit 0
          fi
          git commit -m "chore: 更新 appcast 与版本号至 $tag [skip ci]"
          git push origin main
